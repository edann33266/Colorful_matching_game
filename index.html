<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 Emoji Memory Match Game</title>

    <link rel="stylesheet" href="colormatch.css">
</head>

<body>

    <div class="main-container">

        <!-- Header -->
        <div class="header">
            <h1>🌈 Emoji Memory Match</h1>
            <p class="subtitle">
                Match all the cute emoji pairs before time runs out!
            </p>
        </div>

        <!-- Game Info -->
        <div class="game-info">

            <div class="info-card">
                <h3>🏆 Score</h3>
                <p id="score">0</p>
            </div>

            <div class="info-card">
                <h3>⭐ Best Score</h3>
                <p id="best-score">0</p>
            </div>

            <div class="info-card">
                <h3>🎯 Moves</h3>
                <p id="moves">0</p>
            </div>

            <div class="info-card">
                <h3>⏱ Time Left</h3>
                <p id="timer">60</p>
            </div>

        </div>

        <!-- Timer Progress Bar -->
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <!-- Buttons -->
        <div class="button-container">
            <button id="startbtn">
                🎮 Start Game
            </button>

            <button id="restartbtn">
                🔄 Restart
            </button>
        </div>

        <!-- Game Grid -->
        <div id="game-container">
            <!-- Cards generated by JS -->
        </div>

    </div>

    <!-- Win Popup -->
    <div id="win-popup" class="popup hidden">

        <div class="popup-content">

            <h2>🎉 You Won!</h2>

            <p>
                Amazing job! You matched all emojis!
            </p>

            <div class="popup-stats">
                <p>🏆 Score: <span id="final-score"></span></p>
                <p>🎯 Moves: <span id="final-moves"></span></p>
            </div>

            <button id="play-again-btn">
                🎮 Play Again
            </button>

        </div>

    </div>

    <script src="colormatching.js"></script>

</body>

</html>
